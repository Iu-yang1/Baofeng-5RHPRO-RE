name: XL9951Q raw SPI and watchdog scouting
on:
  push:
    branches:
      - research/xl9951q-spi-watchdog-recovery-integrity
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'capstone==5.0.6'
      - name: Trace archived OEM images without executing firmware
        run: |
          python scripts/xl9951q_spi_wdt_scout.py > xl9951q-spi-wdt-scout.txt
          cat xl9951q-spi-wdt-scout.txt
      - uses: actions/upload-artifact@v4
        with:
          name: xl9951q-spi-wdt-scout
          path: xl9951q-spi-wdt-scout.txt
