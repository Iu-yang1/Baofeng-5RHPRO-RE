name: Pro V2 RF and UI static-disassembly research
on:
  push:
    branches:
      - research/pro-v2-rf-tune-ptt-ui-paths
permissions:
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'capstone==5.0.6'
      - run: |
          python scripts/pro_v2_rf_ui_scout.py > pro-v2-rf-ui-scout.txt
          cat pro-v2-rf-ui-scout.txt
      - name: Verify OEM RF tuning and UI instruction flow
        run: |
          python tools/pro_v2_rf_ui_flow_audit.py --json > pro-v2-rf-ui-flow.json
          cat pro-v2-rf-ui-flow.json
      - uses: actions/upload-artifact@v4
        with:
          name: pro-v2-rf-ui-scout
          path: |
            pro-v2-rf-ui-scout.txt
            pro-v2-rf-ui-flow.json
