name: Firmware offline analysis

on:
  push:
    branches:
      - master
      - "feature/**"
      - "research/**"
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect packages and run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline analysis test dependencies
        run: python -m pip install "capstone==5.0.6" "dnfile==0.18.0" "dncil==1.0.2"
      - name: Run read-only unit tests
        run: python -m unittest discover -s tests -v
      - name: Inspect all stock firmware images
        run: |
          python tools/firmware_inspect.py --strict firmware/*.dat
          python tools/firmware_inspect.py --strict --json firmware/*.dat > firmware-inventory.json
      - name: Audit stock Flash code and updater without device access
        run: |
          python tools/xl9951q_flash_paths_audit.py
          python tools/xl9951q_flash_paths_audit.py --json > xl9951q-flash-updater-evidence.json
      - name: Audit actual UpgradeTool IL and original high Flash NOR calls
        run: |
          python tools/upgrade_tool_il_audit.py --verify > xl9951q-upgrade-tool-il-verified.json
          python tools/xl9951q_high_flash_nor_audit.py --json > xl9951q-high-flash-nor-verified.json
      - name: Audit V1/V2 early-init journal recovery path
        run: |
          python -m py_compile scripts/xl9951q_journal_recovery_discovery.py
          python tools/xl9951q_journal_recovery_audit.py --json > xl9951q-journal-recovery-evidence.json
      - name: Validate OEM Reset-to-journal and NOR WIP error paths
        run: |
          python -m py_compile scripts/xl9951q_reset_nor_error_probe.py
          python tools/xl9951q_reset_nor_error_audit.py --json > xl9951q-reset-nor-error-evidence.json
      - name: Verify OEM SPI3, IWDG and NOR integrity fault paths
        run: |
          python -m py_compile scripts/xl9951q_spi_wdt_scout.py
          python tools/xl9951q_spi_wdt_integrity_audit.py --json > xl9951q-spi-wdt-integrity-evidence.json
      - name: Verify V1/V2 OEM board RF and UI static evidence
        run: |
          python -m py_compile scripts/pro_board_rf_ui_probe.py
          python tools/pro_v2_board_io_audit.py --json > pro-v2-board-io-evidence.json
      - name: Upload firmware metadata only
        uses: actions/upload-artifact@v4
        with:
          name: firmware-inventory
          path: |
            firmware-inventory.json
            xl9951q-flash-updater-evidence.json
            xl9951q-upgrade-tool-il-verified.json
            xl9951q-high-flash-nor-verified.json
            xl9951q-journal-recovery-evidence.json
            xl9951q-reset-nor-error-evidence.json
            xl9951q-spi-wdt-integrity-evidence.json
            pro-v2-board-io-evidence.json
          if-no-files-found: error
