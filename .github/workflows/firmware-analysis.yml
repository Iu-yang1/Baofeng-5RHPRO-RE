name: Firmware offline analysis

on:
  push:
    branches:
      - master
      - "feature/**"
      - "research/**"
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect packages and run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline analysis test dependencies
        run: python -m pip install "capstone==5.0.6" "dnfile==0.18.0" "dncil==1.0.2"
      - name: Run read-only unit tests
        run: python -m unittest discover -s tests -v
      - name: Inspect all stock firmware images
        run: |
          python tools/firmware_inspect.py --strict firmware/*.dat
          python tools/firmware_inspect.py --strict --json firmware/*.dat > firmware-inventory.json
      - name: Audit stock Flash code and updater without device access
        run: |
          python tools/xl9951q_flash_paths_audit.py
          python tools/xl9951q_flash_paths_audit.py --json > xl9951q-flash-updater-evidence.json
      - name: Audit actual UpgradeTool IL and original high Flash NOR calls
        run: |
          python tools/upgrade_tool_il_audit.py --verify > xl9951q-upgrade-tool-il-verified.json
          python tools/xl9951q_high_flash_nor_audit.py --json > xl9951q-high-flash-nor-verified.json
      - name: Audit V1/V2 early-init journal recovery path
        run: python tools/xl9951q_journal_recovery_audit.py --json > xl9951q-journal-recovery-evidence.json
      - name: Upload firmware metadata only
        uses: actions/upload-artifact@v4
        with:
          name: firmware-inventory
          path: |
            firmware-inventory.json
            xl9951q-flash-updater-evidence.json
            xl9951q-upgrade-tool-il-verified.json
            xl9951q-high-flash-nor-verified.json
            xl9951q-journal-recovery-evidence.json
          if-no-files-found: error
