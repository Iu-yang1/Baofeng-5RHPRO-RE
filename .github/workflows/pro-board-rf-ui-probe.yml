name: UV-5RH Pro exploratory GPIO RF and UI map
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "capstone==5.0.6"
      - run: |
          python scripts/pro_board_rf_ui_probe.py > probe.log
      - name: Cross-version OEM board-I/O evidence regression
        run: |
          python tools/pro_v2_board_io_audit.py
          python tools/pro_v2_board_io_audit.py --json > pro-v2-board-io-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: pro-board-rf-ui-probe
          path: |
            probe.log
            pro-v2-board-io-evidence.json
