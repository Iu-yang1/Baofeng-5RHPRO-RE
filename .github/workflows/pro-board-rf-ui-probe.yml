name: UV-5RH Pro exploratory GPIO RF and UI map
on:
  push:
    branches:
      - research/pro-v2-board-rf-ui-static
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "capstone==5.0.6"
      - run: |
          python scripts/pro_board_rf_ui_probe.py > probe.log
          cat probe.log
      - uses: actions/upload-artifact@v4
        with:
          name: pro-board-rf-ui-probe
          path: probe.log
