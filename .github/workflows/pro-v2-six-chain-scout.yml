name: Pro V2 six-chain scout (manual/research PR)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/pro_v2_six_chain_scout.py"
      - ".github/workflows/pro-v2-six-chain-scout.yml"

permissions:
  contents: read

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "capstone==5.0.6"
      - name: Read-only six-chain stock Thumb scout
        run: |
          python scripts/pro_v2_six_chain_scout.py --limit 64
