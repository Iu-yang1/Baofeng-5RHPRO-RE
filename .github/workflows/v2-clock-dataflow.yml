name: V2 clock getter reconnaissance

on:
  push:
    branches:
      - "research/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disassemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Capstone 5
        run: python -m pip install "capstone==5.0.6"
      - name: Verify offline analyses
        run: python -m unittest discover -s tests -v
      - name: V2 clock getter full disassembly
        run: |
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x08030C30 --end 0x08030F20
      - name: V2 startup clock PLL dataflow context
        run: |
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x08031BE0 --end 0x08031C98
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x080323DC --end 0x08032450
      - name: V2 USART caller setup and clock getter call
        run: |
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x08032C90 --end 0x08032D90
      - name: Model V2 original firmware PLL and bus clocks
        run: |
          python tools/v2_clock_tree_model.py firmware/BF_5RH_501_v2_0_9.dat
          python tools/v2_clock_tree_model.py --json firmware/BF_5RH_501_v2_0_9.dat > v2-clock-tree-evidence.json
      - name: Find direct callers of clock getter and peripheral initialization
        run: |
          python tools/thumb_callsites.py firmware/BF_5RH_501_v2_0_9.dat --target 0x08030C30 --target 0x080324F8 --near-start 0x08032C60 --near-end 0x08032CE0
          python tools/thumb_callsites.py firmware/BF_5RH_501_v2_0_9.dat --target 0x08030C30 --target 0x080324F8 --near-start 0x08032C60 --near-end 0x08032CE0 --json > v2-clock-caller-index.json
      - name: Compare old and new clock getter code windows
        run: |
          python tools/compare_sdk_windows.py firmware/BF_5RH_501_v1_1_04.dat firmware/BF_5RH_501_v2_0_9.dat --pair 0x08024AFC:0x08030C30:0x94 --pair 0x08025AC0:0x08031BF4:0x9C
      - name: Decode actual timer-caller calculations for five independent sites
        run: |
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x080088F0 --end 0x08008990
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x08009E48 --end 0x08009EF0
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x080122F0 --end 0x0801239A
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x08017104 --end 0x0801719A
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x080193A8 --end 0x0801944C
      - name: Compare V1 USART clock getter call source without assumed address relocation
        run: |
          python tools/thumb_window.py firmware/BF_5RH_501_v1_1_04.dat --start 0x08026B70 --end 0x08026C5C
      - name: Recover real timer ARR/PSC caller values and 1ms constraint
        run: |
          python tools/timer_clock_callers.py firmware/BF_5RH_501_v2_0_9.dat
          python tools/timer_clock_callers.py --json firmware/BF_5RH_501_v2_0_9.dat > v2-timer-caller-constraints.json
      - name: Examine actual UART configuration callers and their baud rates
        run: |
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x0800C9C0 --end 0x0800CA68
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x080102A0 --end 0x08010360
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x08018BB0 --end 0x08018C64
      - name: Find the V1 clock getter by actual call target
        run: python tools/thumb_window.py firmware/BF_5RH_501_v1_1_04.dat --start 0x08026B80 --end 0x08026C58
      - name: Archive read-only metadata only
        uses: actions/upload-artifact@v4
        with:
          name: v2-clock-tree-and-callsites
          path: |
            v2-clock-tree-evidence.json
            v2-clock-caller-index.json
            v2-timer-caller-constraints.json
          if-no-files-found: error
