name: V2 clock getter reconnaissance

on:
  push:
    branches:
      - "research/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disassemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Capstone 5
        run: python -m pip install "capstone==5.0.6"
      - name: Verify offline analyses
        run: python -m unittest discover -s tests -v
      - name: V2 clock getter full disassembly
        run: |
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x08030C30 --end 0x08030F20
      - name: V2 startup clock PLL dataflow context
        run: |
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x08031BE0 --end 0x08031C98
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x080323DC --end 0x08032450
      - name: V2 USART caller setup and clock getter call
        run: |
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x08032C90 --end 0x08032D90
