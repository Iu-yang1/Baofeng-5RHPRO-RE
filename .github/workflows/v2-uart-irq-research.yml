name: V2 UART / IRQ / firmware architecture research

on:
  push:
    branches:
      - "research/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install disassembler
        run: python -m pip install "capstone==5.0.6"
      - name: Run all offline tests
        run: python -m unittest discover -s tests -v
      - name: Inspect stock V2 USART literal references and IRQ vectors
        run: |
          python tools/v2_uart_irq_evidence.py firmware/BF_5RH_501_v2_0_9.dat
          python tools/v2_uart_irq_evidence.py --json firmware/BF_5RH_501_v2_0_9.dat > v2-uart-irq-evidence.json
      - name: Disassemble USART SDK helpers and peripheral control
        run: |
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x08032C00 --end 0x08032D00
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x08030B80 --end 0x08030BFA
      - name: Gather runtime CRM CFG register writes
        run: |
          python tools/clock_register_trace.py --scope vectors --show-context --pc-from 0x08001000 --pc-to 0x08034000 firmware/BF_5RH_501_v2_0_9.dat > v2-register-writes.txt
          grep -A 7 -B 1 ' -> CRM/RCC CFG/CFGR write' v2-register-writes.txt | head -160 || true
      - name: Disassemble actual USART IRQ handlers and their shared routines
        run: |
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x08032B00 --end 0x08032C28
      - name: Inspect application UART data producer consumer contexts
        run: |
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x080063A0 --end 0x08006430
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x080186D0 --end 0x08018780
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x0800CA88 --end 0x0800CB10
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x08010366 --end 0x080103DE
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x08018C50 --end 0x08018CCC
      - name: Inspect USART2 DMA receive completion parser and USART3 buffer state
        run: |
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x0800F168 --end 0x0800F2A8
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x08032B28 --end 0x08032B40
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x080063BC --end 0x0800641C
      - name: Verify USART2 NMEA, USART3 XOR and USART1 RX ring fingerprints
        run: |
          python tools/v2_uart_protocol_evidence.py firmware/BF_5RH_501_v2_0_9.dat
          python tools/v2_uart_protocol_evidence.py --json firmware/BF_5RH_501_v2_0_9.dat > v2-uart-protocol-evidence.json
      - name: Reconcile original V2 RAM layout with scatterload and initial SP
        run: |
          python tools/v2_memory_layout.py firmware/BF_5RH_501_v2_0_9.dat
          python tools/v2_memory_layout.py --json firmware/BF_5RH_501_v2_0_9.dat > v2-memory-layout.json
      - name: Upload metadata (no decoded firmware image)
        uses: actions/upload-artifact@v4
        with:
          name: v2-uart-irq-and-register-map
          path: |
            v2-uart-irq-evidence.json
            v2-uart-protocol-evidence.json
            v2-register-writes.txt
            v2-memory-layout.json
          if-no-files-found: error
