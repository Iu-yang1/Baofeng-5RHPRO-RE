name: UV-5RH Pro V2 boot trace

on:
  push:
    branches:
      - "research/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Capstone Thumb disassembler
        run: python -m pip install "capstone==5.0.6"
      - name: Run all offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Decode V1 and V2 boot vectors and Thumb control flow
        run: |
          python tools/v2_boot_trace.py firmware/BF_5RH_501_v1_1_04.dat firmware/BF_5RH_501_v2_0_9.dat
          python tools/v2_boot_trace.py --json firmware/BF_5RH_501_v1_1_04.dat firmware/BF_5RH_501_v2_0_9.dat > v1-v2-boot-trace.json
      - name: Upload static-analysis report (no firmware payloads)
        uses: actions/upload-artifact@v4
        with:
          name: uv5rhpro-v1-v2-boot-trace
          path: v1-v2-boot-trace.json
          if-no-files-found: error
