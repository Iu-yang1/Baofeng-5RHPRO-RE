name: XL9951Q reset-to-recovery and NOR error reconnaissance
on:
  push:
    branches:
      - research/xl9951q-reset-nor-status-error-flow
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'capstone==5.0.6'
      - name: Inspect archived OEM control flow (no device access)
        run: python scripts/xl9951q_reset_nor_discovery.py
