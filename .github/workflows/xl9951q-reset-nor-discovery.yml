name: XL9951Q reset-to-recovery and NOR error reconnaissance
on:
  push:
    branches:
      - research/xl9951q-reset-nor-status-error-flow
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'capstone==5.0.6'
      - name: Verify archived OEM reset/NOR error chain (no device access)
        run: |
          python tools/xl9951q_reset_nor_status_audit.py --json > xl9951q-reset-nor-error-evidence.json
          cat xl9951q-reset-nor-error-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: xl9951q-reset-nor-error-evidence
          path: xl9951q-reset-nor-error-evidence.json
