name: MCU fingerprint analysis

on:
  push:
    branches:
      - "research/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compare package address patterns (no device access)
        run: |
          python tools/mcu_fingerprint.py firmware/BF_5RH_501_v1_1_04.dat firmware/BF_5RH_501_v2_0_9.dat
          python tools/mcu_fingerprint.py --json firmware/BF_5RH_501_v1_1_04.dat firmware/BF_5RH_501_v2_0_9.dat > mcu-fingerprint.json
      - name: Upload evidence-only JSON
        uses: actions/upload-artifact@v4
        with:
          name: mcu-fingerprint-json
          path: mcu-fingerprint.json
          if-no-files-found: error
