name: V2 peripheral clock constraints

on:
  push:
    branches:
      - "research/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-clock-constraints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install disassembler
        run: python -m pip install "capstone==5.0.6"
      - name: Run all offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Find USART BRR and timer PSC/ARR accesses in V2 firmware
        run: |
          python tools/peripheral_clock_constraints.py firmware/BF_5RH_501_v2_0_9.dat
          python tools/peripheral_clock_constraints.py --scope vectors --json firmware/BF_5RH_501_v1_1_04.dat firmware/BF_5RH_501_v2_0_9.dat > v1-v2-peripheral-clock-constraints.json
      - name: Store derived metadata only
        uses: actions/upload-artifact@v4
        with:
          name: v2-peripheral-clock-constraints
          path: v1-v2-peripheral-clock-constraints.json
          if-no-files-found: error
