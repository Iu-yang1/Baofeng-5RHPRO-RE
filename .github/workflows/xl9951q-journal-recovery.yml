name: XL9951Q archived journal recovery reconnaissance
on:
  push:
    branches:
      - research/xl9951q-journal-recovery-cfg
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare disassembler
        run: python -m pip install 'capstone==5.0.6'
      - name: Trace startup and journal literal XREFs (read-only)
        run: |
          python tools/xl9951q_journal_recovery_discovery.py > xl9951q-journal-recovery-trace.txt
          cat xl9951q-journal-recovery-trace.txt
      - name: Verify restored transaction control flow
        run: |
          python tools/xl9951q_journal_recovery_audit.py
          python tools/xl9951q_journal_recovery_audit.py --json > xl9951q-journal-recovery-validated.json
          cat xl9951q-journal-recovery-validated.json
      - uses: actions/upload-artifact@v4
        with:
          name: xl9951q-journal-recovery-trace
          path: |
            xl9951q-journal-recovery-trace.txt
            xl9951q-journal-recovery-validated.json
