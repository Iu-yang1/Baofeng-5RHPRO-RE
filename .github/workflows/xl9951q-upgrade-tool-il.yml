name: XL9951Q UpgradeTool IL and SPI NOR forensic analysis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-il:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline .NET IL parser
        run: python -m pip install 'dnfile==0.18.0' 'dncil==1.0.2' 'capstone==5.0.6'
      - name: Parse archived vendor .NET IL statically
        run: |
          python tools/upgrade_tool_il_audit.py > xl9951q-upgrade-tool-il-overview.txt
          python tools/upgrade_tool_il_audit.py --json > xl9951q-upgrade-tool-il.json
          python tools/upgrade_tool_il_audit.py --verify > xl9951q-upgrade-tool-il-verified.json
          python tools/xl9951q_high_flash_nor_audit.py --json > xl9951q-high-flash-nor-verified.json
          cat xl9951q-upgrade-tool-il-verified.json
          cat xl9951q-high-flash-nor-verified.json
      - name: Read-only disassembly of application high Flash callers
        run: |
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x0800D2D0 --end 0x0800D344 > xl9951q-v2-high-address-callers.txt
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x080190D0 --end 0x080191D0 >> xl9951q-v2-high-address-callers.txt
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x080107D0 --end 0x08010824 >> xl9951q-v2-high-address-callers.txt
          python tools/thumb_window.py firmware/BF_5RH_501_v1_1_04.dat --start 0x08007C40 --end 0x08007C94 > xl9951q-v1-high-address-callers.txt
          python tools/thumb_window.py firmware/BF_5RH_501_v1_1_04.dat --start 0x08012D80 --end 0x08012E94 >> xl9951q-v1-high-address-callers.txt
          python tools/thumb_window.py firmware/BF_5RH_501_v1_1_04.dat --start 0x0800AF50 --end 0x0800AF90 >> xl9951q-v1-high-address-callers.txt
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x08006AA8 --end 0x08006B94 > xl9951q-v2-nor-helpers.txt
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x08006B94 --end 0x08006CC0 >> xl9951q-v2-nor-helpers.txt
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x0800D320 --end 0x0800D3D0 >> xl9951q-v2-nor-helpers.txt
          python tools/thumb_window.py firmware/BF_5RH_501_v1_1_04.dat --start 0x08002F90 --end 0x080031B0 > xl9951q-v1-nor-helpers.txt
          python tools/thumb_window.py firmware/BF_5RH_501_v1_1_04.dat --start 0x08007C80 --end 0x08007D10 >> xl9951q-v1-nor-helpers.txt
          python tools/thumb_window.py firmware/BF_5RH_501_v2_0_9.dat --start 0x08010620 --end 0x08010828 > xl9951q-v2-journal-recovery-context.txt
          python tools/thumb_callsites.py firmware/BF_5RH_501_v2_0_9.dat --target 0x080190E0 --target 0x0800D304 --target 0x0800D334 --target 0x08006AA8 >> xl9951q-v2-journal-recovery-context.txt
      - uses: actions/upload-artifact@v4
        with:
          name: xl9951q-upgrade-tool-il-metadata
          path: |
            xl9951q-upgrade-tool-il-overview.txt
            xl9951q-upgrade-tool-il.json
            xl9951q-upgrade-tool-il-verified.json
            xl9951q-high-flash-nor-verified.json
            xl9951q-v2-high-address-callers.txt
            xl9951q-v1-high-address-callers.txt
            xl9951q-v2-nor-helpers.txt
            xl9951q-v2-journal-recovery-context.txt
            xl9951q-v1-nor-helpers.txt
